<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Toolkit</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icon-192.png"><meta name="theme-color" content="#7c3aed"><style>
:root{--bg:#f4f1fb;--card:#fff;--tx:#1e1b2e;--mu:#6b6785;--bd:#e3def3;--a:#7c3aed;color-scheme:light dark}

*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;color:#fff;background:linear-gradient(110deg,#6d28d9,#db2777 55%,#f97316)}
.credit{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:14px;white-space:nowrap}
.logo{font:700 20px "Segoe UI",sans-serif;letter-spacing:.3px}#dn{flex:1;min-width:0;opacity:.9;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:20px;padding:6px 16px;cursor:pointer;font:inherit;font-weight:600}header button:hover{background:rgba(255,255,255,.35)}
#tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}
#tabs button{border:0;background:none;color:var(--mu);padding:9px 16px;font:600 14px inherit;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
#tabs button.on{color:#fff;background:var(--a)}#tabs button:not(.on):hover{color:var(--a)}
#rib{display:flex;gap:0;padding:8px 12px;background:var(--card);border-bottom:3px solid var(--a);overflow-x:auto;min-height:92px}
.grp{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--bd)}.grp:last-child{border:0}
.gb{display:flex;gap:2px;flex:1;align-items:stretch}.gt{text-align:center;font-size:11px;font-weight:700;color:var(--a);text-transform:uppercase;letter-spacing:.8px;padding-top:3px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;padding:5px 7px;border:0;border-radius:10px;background:none;color:var(--tx);cursor:pointer;font:12px inherit}
.rb i{font-style:normal;font-size:23px;line-height:1.1}.rb:hover{background:color-mix(in srgb,var(--a) 14%,transparent);transform:translateY(-1px)}
.rb.on{background:var(--a);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--a) 50%,transparent)}
.ctl{display:flex;flex-direction:column;gap:4px;justify-content:center;font-size:12px;color:var(--mu);padding:0 8px}.ctl input,.ctl select{width:90px}
#main{flex:1;min-height:0;position:relative}
#vw{position:absolute;inset:0;overflow:auto;background:linear-gradient(160deg,#8b87a8,#5e5a7a);padding:16px;text-align:center}
#pv{background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);display:inline-block}
#home{position:absolute;inset:0;overflow:auto;padding:22px}
.hero{border-radius:20px;padding:34px;color:#fff;background:linear-gradient(120deg,#6d28d9,#db2777 60%,#f97316);box-shadow:0 10px 30px rgba(124,58,237,.35)}
.hero h2{margin:0 0 6px;font:700 30px "Segoe UI",sans-serif}.hero p{margin:0 0 16px;opacity:.92}.hero button{background:#fff;color:#7c3aed;border:0;border-radius:24px;padding:11px 24px;font:700 15px inherit;cursor:pointer;margin-right:10px}
.hg{margin:24px 0 8px;font:700 13px inherit;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border:0;border-radius:16px;padding:16px;text-align:left;color:#fff;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.25)}.tile b{display:block;font-size:15px}.tile small{opacity:.9}.tile i{font-style:normal;font-size:28px;display:block;margin-bottom:4px}
#st{padding:6px 16px;font-size:13px;color:var(--mu);background:var(--card);border-top:1px solid var(--bd);display:flex;gap:16px}#st.err{color:#dc2626;font-weight:600}#st span:first-child{flex:1}
.ov{position:fixed;inset:0;background:rgba(10,8,25,.55);display:flex;align-items:center;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.dg{background:var(--card);border-radius:16px;padding:20px;min-width:320px;max-width:92vw;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--a);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.dg h3{margin:0;color:var(--a)}.dg .r{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dg button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 16px;border-radius:10px;cursor:pointer;font:inherit}.dg button.b{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
#sg{border:2px dashed var(--bd);border-radius:10px;background:#fff;width:100%;touch-action:none;cursor:crosshair}
.ml div{display:flex;gap:6px;align-items:center;padding:3px 0}.ml span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
@media(max-width:700px){header{padding:8px 10px;flex-wrap:wrap}.credit{order:9;width:100%;text-align:center;font-size:11px}header button{padding:5px 10px}.logo{font-size:17px}#dn{display:none}#home{padding:12px}.hero{padding:20px}.hero h2{font-size:22px}.rb{min-width:58px}#vw{padding:6px}}

.dg{max-height:92vh;overflow:auto}.dg label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}.pgrid label:has(input[type=checkbox]){justify-content:flex-start}
.r2{display:flex;gap:8px;flex-wrap:wrap}.pvbox{display:flex;gap:12px;align-items:center;min-height:60px}.pvbox img{max-height:150px;max-width:170px;border:1px solid var(--bd);background:#fff}.pvbox img:not([src]){display:none}
#pr{display:none}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}}
@media print{html,body{height:auto!important;display:block!important;background:#fff!important}body>*:not(#pr){display:none!important}#pr{display:block!important}#pr img{display:block;break-after:page}}
</style><style id="pst"></style></head><body>
<header><span class="logo">📕 PDF Toolkit</span><span id="dn">No document open</span><span class="credit">Created by Washim Reja. Contact: 7003714487</span><button id="hundo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="hredo" title="Redo (Ctrl+Y)">↷ Redo</button><button id="hopen">Open</button><button id="hsave">Save</button></header>
<div id="tabs"></div><div id="rib"></div>
<div id="main"><div id="home"></div><div id="vw" hidden><canvas id="pv"></canvas></div></div>
<div id="pr"></div>
<div id="st"><span id="msg">Ready.</span><span id="pi"></span></div>
<input type="file" id="fin" accept=".pdf" hidden><input type="file" id="iin" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const S={id:null,pages:0,sizes:[],pg:1,Z:96/72,ops:[],tool:null,col:'#ffd400',w:3,meas:[],unit:'mm',ver:0,name:'',sig:null,img:null,stamp:null,hist:[],fut:[],sel:null,el:new Image()};
const STAMPS=[['Approved',0,'#16a34a'],['Draft',4,'#2563eb'],['Confidential',2,'#dc2626'],['Final',7,'#7c3aed'],['Not Approved',10,'#dc2626'],['Top Secret',13,'#b91c1c'],['For Comment',8,'#d97706'],['Sold',12,'#0891b2']];
const ACC={Home:'#7c3aed',View:'#0ea5e9',Annotate:'#f59e0b',Edit:'#ec4899',Organize:'#10b981',Convert:'#6366f1',Protect:'#ef4444',Tools:'#14b8a6'};
const toast=(m,e)=>{$('#msg').textContent=m;$('#st').className=e?'err':''};
const B=(i,l,f,t,free)=>({i,l,f,t,free});
/* ---------- dialogs ---------- */
function dlg(title,html,ok='OK',setup){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.style.setProperty('--a',ACC[curTab]||'#7c3aed');
 o.innerHTML=`<form class="dg"><h3>${title}</h3>${html}<div class="r"><button type="button" class="cx">Cancel</button><button class="b">${ok}</button></div></form>`;document.body.append(o);
 const f=o.firstChild;setup&&setup(f);f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r={d,f,fd:new FormData(f)};o.remove();res(r)};
 f.querySelector('.cx').onclick=()=>{o.remove();res(null)};const i=f.querySelector('input:not([type=file]),select,textarea');i&&i.focus()})}
async function call(url,fd){toast('Working…');try{const r=await fetch(url,{method:'POST',body:fd});if(!r.ok){toast(await r.text(),1);return null}return await r.json()}catch(e){toast(String(e),1);return null}}
function adopt(j,keep){if(!keep){S.ops=[];S.hist=[];S.fut=[];S.sel=null}S.id=j.id;S.pages=j.pages;S.sizes=j.sizes;S.name=j.name;S.pg=keep?Math.min(S.pg,j.pages):1;S.ver++;$('#dn').textContent=j.name+'.pdf';if(j.msg)toast(j.msg);else toast('Ready.');load()}
async function commit(){if(!S.ops.length||!S.id)return;const fd=new FormData();fd.append('id',S.id);fd.append('ops',JSON.stringify(S.ops));const j=await call('/api/apply',fd);if(j){S.ops=[];S.hist=[];S.fut=[];S.sel=null;S.ver++;adopt(j,1)}}
async function mut(a,x={}){await commit();const fd=new FormData();fd.append('id',S.id);fd.append('page',S.pg);for(const k in x)fd.append(k,x[k]);const j=await call('/api/do/'+a,fd);j&&adopt(j,1)}
async function exp(a,x={},nm='file'){await commit();const fd=new FormData();fd.append('id',S.id);for(const k in x)fd.append(k,x[k]);toast('Working…');
 const r=await fetch('/api/export/'+a,{method:'POST',body:fd});if(!r.ok)return toast(await r.text(),1);const j=await r.json();
 const l=document.createElement('a');l.href=j.url;l.download='';document.body.append(l);l.click();l.remove();toast(j.info||'Saved. Check your Downloads.')}
/* ---------- open / merge / convert ---------- */
async function openFile(f,pw){const fd=new FormData();fd.append('file',f);if(pw)fd.append('password',pw);const j=await call('/api/open',fd);if(!j)return;
 if(j.needs_password){const r=await dlg('🔒 Password required','<input type="password" name="p" placeholder="Document password" required>','Unlock');return r&&openFile(f,r.d.p)}
 S.ops=[];S.meas=[];adopt(j);tab('View');zoom('w')}
const pick=()=>$('#fin').click();$('#fin').onchange=e=>{e.target.files[0]&&openFile(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&/\.pdf$/i.test(f.name)&&openFile(f)});
async function mergeDlg(){let files=[];await commit();
 const r=await dlg('🧩 Merge PDFs',`<input type="file" id="mf" multiple accept=".pdf"><div class="ml" id="ml">No files added yet.</div>${S.id?'<label><input type="checkbox" name="cur" checked> Put the open document first</label>':''}`,'Merge',f=>{
  const draw=()=>{const l=f.querySelector('#ml');l.innerHTML=files.length?'':'No files added yet.';files.forEach((x,i)=>{const d=document.createElement('div');d.innerHTML=`<span>${i+1}. ${x.name}</span><button type="button">↑</button><button type="button">↓</button><button type="button">✕</button>`;const b=d.querySelectorAll('button');
   b[0].onclick=()=>{if(i){[files[i-1],files[i]]=[files[i],files[i-1]];draw()}};b[1].onclick=()=>{if(i<files.length-1){[files[i+1],files[i]]=[files[i],files[i+1]];draw()}};b[2].onclick=()=>{files.splice(i,1);draw()};l.append(d)})};
  f.querySelector('#mf').onchange=e=>{files.push(...e.target.files);e.target.value='';draw()}});
 if(!r)return;if(!files.length&&!(S.id&&r.d.cur))return toast('Add at least one PDF.',1);
 const fd=new FormData();if(S.id&&r.d.cur)fd.append('id',S.id);files.forEach(x=>fd.append('files',x));const j=await call('/api/merge',fd);if(j){S.ops=[];adopt(j);tab('View');zoom('w')}}
async function toPdfDlg(){const r=await dlg('📥 Create PDF from files','<p>Word, Excel, PowerPoint, text and images. Several files are merged into one PDF.</p><input type="file" name="files" multiple required>','Convert');
 if(!r)return;const j=await call('/api/to-pdf',r.fd);if(j){S.ops=[];adopt(j);tab('View');zoom('w')}}
/* ---------- viewer ---------- */
function load(){if(!S.id)return;S.el=new Image();S.el.onload=()=>{pv.width=S.el.width;pv.height=S.el.height;draw()};S.el.src=`/api/preview/${S.id}/${S.pg}?z=${S.Z.toFixed(3)}&v=${S.ver}`;$('#pi').textContent=`Page ${S.pg} / ${S.pages}  ·  ${Math.round(S.Z*75)}%`}
function go(n){if(S.id&&n>=1&&n<=S.pages){S.pg=n;load()}}
function zoom(m){if(!S.id)return;const [W,H]=S.sizes[S.pg-1],vw=$('#vw'),aw=(vw.clientWidth||900)-40,ah=(vw.clientHeight||600)-40;
 S.Z=m=='act'?96/72:m=='w'?aw/W:m=='p'?Math.min(aw/W,ah/H):Math.max(.3,Math.min(5,S.Z*m));load()}
const pv=$('#pv'),g=pv.getContext('2d');
function drawOp(o,Z=S.Z){g.save();g.lineCap=g.lineJoin='round';const c=o.color||'#000';
 if(o.t=='hl'){g.fillStyle=c;g.globalAlpha=.4;g.fillRect(o.x*Z,o.y*Z,o.w*Z,o.h*Z)}
 else if(o.t=='ul'||o.t=='st'){g.strokeStyle=c;g.lineWidth=1.5*Z;const y=(o.t=='ul'?o.y+o.h:o.y+o.h/2)*Z;g.beginPath();g.moveTo(o.x*Z,y);g.lineTo((o.x+o.w)*Z,y);g.stroke()}
 else if(o.t=='ink'){g.strokeStyle=c;g.globalAlpha=o.alpha;g.lineWidth=o.w*Z;g.beginPath();o.pts.forEach((p,i)=>i?g.lineTo(p[0]*Z,p[1]*Z):g.moveTo(p[0]*Z,p[1]*Z));g.stroke()}
 else if(o.t=='text'){g.fillStyle=c;g.font=`${o.s*Z}px Helvetica,Arial`;o.v.split('\n').forEach((l,i)=>g.fillText(l,o.x*Z,(o.y+i*o.s*1.2)*Z))}
 else if(o.t=='callout'){g.strokeStyle=c;g.lineWidth=1.2*Z;g.beginPath();g.moveTo((o.bx+o.bw/2)*Z,(o.by+o.bh/2)*Z);g.lineTo(o.x*Z,o.y*Z);g.stroke();g.fillStyle='#fffecc';g.fillRect(o.bx*Z,o.by*Z,o.bw*Z,o.bh*Z);g.strokeRect(o.bx*Z,o.by*Z,o.bw*Z,o.bh*Z);g.fillStyle='#000';g.font=`${o.s*Z}px Helvetica,Arial`;g.fillText(o.v,(o.bx+4)*Z,(o.by+o.s+3)*Z,(o.bw-8)*Z)}
 else if(o.t=='image'||o.t=='sign'){const i=new Image();i.src=o.v;if(i.complete)g.drawImage(i,o.x*Z,o.y*Z,o.w*Z,o.h*Z);else i.onload=()=>g.drawImage(i,o.x*Z,o.y*Z,o.w*Z,o.h*Z)}
 else if(o.t=='stamp'){const s=STAMPS.find(x=>x[1]==o.i);g.strokeStyle=g.fillStyle=s[2];g.lineWidth=3*Z;g.strokeRect(o.x*Z,o.y*Z,o.w*Z,o.h*Z);g.font=`bold ${16*Z}px Helvetica,Arial`;g.textAlign='center';g.fillText(s[0].toUpperCase(),(o.x+o.w/2)*Z,(o.y+o.h/2+6)*Z)}
 else if(o.t=='note'){g.fillStyle='#fde047';g.strokeStyle='#a16207';g.fillRect(o.x*Z,o.y*Z,18*Z,18*Z);g.strokeRect(o.x*Z,o.y*Z,18*Z,18*Z);g.fillStyle='#000';g.font=`${11*Z}px Arial`;g.fillText('≡',(o.x+4)*Z,(o.y+13)*Z)}
 else if(o.t=='redact'){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(o.x*Z,o.y*Z,o.w*Z,o.h*Z);g.strokeStyle='#ef4444';g.strokeRect(o.x*Z,o.y*Z,o.w*Z,o.h*Z)}
 else if(o.t=='replace'){const b=o.bbox;g.fillStyle='#fff';g.fillRect(b[0]*Z,b[1]*Z,(b[2]-b[0])*Z,(b[3]-b[1])*Z);g.fillStyle=o.color;g.font=`${o.bold?'bold ':''}${o.s*Z}px Helvetica,Arial`;g.fillText(o.v,o.origin[0]*Z,o.origin[1]*Z)}
 g.restore()}
function measDraw(m){const Z=S.Z;g.save();g.strokeStyle='#0ea5e9';g.fillStyle='#0ea5e9';g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.moveTo(m.x0*Z,m.y0*Z);g.lineTo(m.x1*Z,m.y1*Z);g.stroke();g.setLineDash([]);
 const d=Math.hypot(m.x1-m.x0,m.y1-m.y0),f={pt:1,mm:25.4/72,cm:2.54/72,in:1/72}[S.unit],t=(d*f).toFixed(2)+' '+S.unit;g.font='bold 14px Arial';const w=g.measureText(t).width+10,mx=(m.x0+m.x1)/2*Z,my=(m.y0+m.y1)/2*Z;g.fillRect(mx-w/2,my-22,w,20);g.fillStyle='#fff';g.textAlign='center';g.fillText(t,mx,my-7);g.restore()}
let drag=null;
function draw(){if(!S.el.complete||!S.el.width)return;g.drawImage(S.el,0,0);S.ops.filter(o=>o.page==S.pg).forEach(o=>drawOp(o));S.meas.filter(m=>m.page==S.pg).forEach(measDraw);
 const so=S.ops[S.sel];if(so&&so.page==S.pg){const b=bbox(so),Z=S.Z;g.save();g.strokeStyle='#2563eb';g.setLineDash([5,4]);g.lineWidth=2;g.strokeRect(b[0]*Z-3,b[1]*Z-3,(b[2]-b[0])*Z+6,(b[3]-b[1])*Z+6);if(resizable(so)){g.setLineDash([]);g.fillStyle='#2563eb';g.fillRect(b[2]*Z-6,b[3]*Z-6,12,12)}g.restore()}
 if(!drag)return;const [x0,y0]=drag.p0,[x1,y1]=drag.p1,t=S.tool,Z=S.Z;
 if(['hl','ul','st','redact'].includes(t))drawOp({t,color:S.col,x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)});
 else if(t=='pen'||t=='brush')drawOp({t:'ink',pts:drag.pts,w:t=='pen'?S.w:Math.max(10,S.w*4),alpha:t=='pen'?1:.45,color:S.col});
 else if(t=='line')drawOp({t:'ink',pts:[drag.p0,drag.p1],w:S.w,alpha:1,color:S.col});
 else if(t=='callout'){g.strokeStyle='#ec4899';g.beginPath();g.moveTo(x0*Z,y0*Z);g.lineTo(x1*Z,y1*Z);g.stroke()}
 else if(t=='measure')measDraw({x0,y0,x1,y1})}
const pt=e=>{const r=pv.getBoundingClientRect();return[(e.clientX-r.left)*pv.width/r.width/S.Z,(e.clientY-r.top)*pv.height/r.height/S.Z]};
function bbox(o){if(o.t=='ink'){const x=o.pts.map(p=>p[0]),y=o.pts.map(p=>p[1]);return[Math.min(...x),Math.min(...y),Math.max(...x),Math.max(...y)]}
 if(o.t=='text')return[o.x,o.y-o.s,o.x+o.v.length*o.s*.55,o.y+o.s*.3];if(o.t=='callout')return[o.bx,o.by,o.bx+o.bw,o.by+o.bh];if(o.t=='note')return[o.x,o.y,o.x+18,o.y+18];
 if(o.t=='replace')return o.bbox;return[o.x,o.y,o.x+(o.w||0),o.y+(o.h||0)]}
function erase(p){const old=S.ops,kept=old.filter(o=>{if(o.page!=S.pg)return true;const b=bbox(o);return!(p[0]>=b[0]-6&&p[0]<=b[2]+6&&p[1]>=b[1]-6&&p[1]<=b[3]+6)});
 if(kept.length!=old.length){if(!drag.sn){S.hist.push(JSON.parse(JSON.stringify(old)));S.fut=[];drag.sn=1}S.ops=kept;S.sel=null;draw()}}
pv.onpointerdown=e=>{if(!S.id||!S.tool)return;const p=pt(e);drag={p0:p,p1:p,pts:[p],last:p};pv.setPointerCapture(e.pointerId);
 if(S.tool=='eraser')erase(p);
 else if(S.tool=='select'){if(handleHit(p)){drag.mode='resize';const o=S.ops[S.sel];drag.ar=o.h/o.w}else{const i=hitIdx(p);if(i<0){S.sel=null;drag=null;draw();return}S.sel=i;drag.mode='move'}pushHist();draw()}};
pv.onpointermove=e=>{if(!drag)return;const p=pt(e);drag.p1=p;drag.pts.push(p);
 if(S.tool=='eraser')erase(p);
 else if(drag.mode){const o=S.ops[S.sel];if(drag.mode=='move')moveOp(o,p[0]-drag.last[0],p[1]-drag.last[1]);else{o.w=Math.max(12,p[0]-o.x);o.h=['image','sign','stamp'].includes(o.t)?o.w*drag.ar:Math.max(8,p[1]-o.y)}drag.last=p;drag.moved=1}
 draw()};
